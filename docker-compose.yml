version: "3.8"

services:
  db:
    image: postgres:15
    container_name: study-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: studyflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend 
    container_name: study-backend
    restart: always
    depends_on:
      - db
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env     

volumes:
  pgdata: